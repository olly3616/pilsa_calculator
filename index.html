<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="dot"></div>
        <div class="app-title">계산기</div>
      </div>
      <div class="menu-dots">&#8942;</div>
    </div>

    <div class="display-area">
      <div class="subline" id="subline"></div>
      <div class="display" id="display">0</div>
    </div>

    <div class="keypad" id="keypad">
      <button class="calc-key k-mode" data-k="mode" type="button">
        <span class="rad-label">Rad</span><span class="sep">&middot;</span><span class="deg-label">Deg</span>
      </button>
      <button class="calc-key k-inv" data-k="inv" type="button">Inv</button>
      <button class="calc-key k-ce" data-k="CE" type="button">CE</button>
      <button class="calc-key k-paren" data-k="(" type="button">(</button>
      <button class="calc-key k-paren" data-k=")" type="button">)</button>
      <button class="calc-key k-op" data-k="*" type="button">&times;</button>

      <button class="calc-key k-fn" id="sin-btn" data-k="sin" type="button">sin</button>
      <button class="calc-key k-fn" id="cos-btn" data-k="cos" type="button">cos</button>
      <button class="calc-key k-fn" id="tan-btn" data-k="tan" type="button">tan</button>
      <button class="calc-key k-num" data-k="7" type="button">7</button>
      <button class="calc-key k-num" data-k="8" type="button">8</button>
      <button class="calc-key k-num" data-k="9" type="button">9</button>
      <button class="calc-key k-op" data-k="/" type="button">&divide;</button>

      <button class="calc-key k-fn" data-k="!" type="button">x!</button>
      <button class="calc-key k-fn" data-k="ln" type="button">ln</button>
      <button class="calc-key k-fn" data-k="pi" type="button" style="font-size:18px;">&pi;</button>
      <button class="calc-key k-num" data-k="4" type="button">4</button>
      <button class="calc-key k-num" data-k="5" type="button">5</button>
      <button class="calc-key k-num" data-k="6" type="button">6</button>
      <button class="calc-key k-op k-op-lg" data-k="-" type="button">&minus;</button>

      <button class="calc-key k-fn" data-k="log" type="button">log</button>
      <button class="calc-key k-fn" data-k="e" type="button" style="font-size:18px;">e</button>
      <button class="calc-key k-fn" data-k="sqrt" type="button" style="font-size:18px;">&radic;</button>
      <button class="calc-key k-num" data-k="1" type="button">1</button>
      <button class="calc-key k-num" data-k="2" type="button">2</button>
      <button class="calc-key k-num" data-k="3" type="button">3</button>
      <button class="calc-key k-op k-op-lg" data-k="+" type="button">+</button>

      <button class="calc-key k-fn" data-k="Ans" type="button">Ans</button>
      <button class="calc-key k-fn" data-k="EXP" type="button">EXP</button>
      <button class="calc-key k-fn" data-k="^" type="button">x<sup>y</sup></button>
      <button class="calc-key k-num" data-k="." type="button">.</button>
      <button class="calc-key k-num" data-k="0" type="button">0</button>
      <button class="calc-key k-back" data-k="back" type="button">&#9003;</button>
      <button class="calc-key k-eq" data-k="=" type="button">=</button>
    </div>

    <div class="footnote">13번째 유효숫자에서 반올림하며, 15자리 이상의 계산은 오차가 있을 수 있습니다.</div>
  </div>

<script src="script.js"></script>
</body>
</html>
