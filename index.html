<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: linear-gradient(135deg,#ffe6f2 0%,#f0ecff 45%,#e4f3ff 100%);
    font-family: 'Noto Sans KR','Poppins',sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
    overflow: hidden;
  }

  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { top: -80px; left: -60px; width: 340px; height: 340px; background: radial-gradient(circle,#ffb3d9 0%,rgba(255,179,217,0) 70%); filter: blur(10px); }
  .blob-2 { bottom: -100px; right: -40px; width: 380px; height: 380px; background: radial-gradient(circle,#a9d6ff 0%,rgba(169,214,255,0) 70%); filter: blur(10px); }
  .blob-3 { top: 40%; right: 22%; width: 180px; height: 180px; background: radial-gradient(circle,#d5c2ff 0%,rgba(213,194,255,0) 70%); filter: blur(6px); }

  .card {
    position: relative;
    width: 600px;
    max-width: 100%;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 34px;
    box-shadow: 0 24px 70px rgba(150,110,180,.22), inset 0 1px 0 rgba(255,255,255,.9);
    overflow: hidden;
  }

  .titlebar { display: flex; align-items: center; justify-content: space-between; padding: 22px 26px 6px; }
  .titlebar-left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg,#ff9dc4,#8ec8ff); box-shadow: 0 2px 6px rgba(255,150,190,.5); }
  .app-title { font-size: 19px; font-weight: 700; color: #4a4560; letter-spacing: -.2px; }
  .menu-dots { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #b3aec6; font-size: 20px; line-height: 1; border-radius: 50%; user-select: none; }

  .display-area {
    margin: 14px 26px 0;
    padding: 22px 24px;
    border-radius: 24px;
    background: linear-gradient(135deg,rgba(255,235,246,.7),rgba(233,243,255,.7));
    border: 1px solid rgba(255,255,255,.8);
    min-height: 96px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
  }
  .subline {
    font-size: 14px; color: #a79fbf; font-family: 'Poppins',sans-serif;
    min-height: 16px; max-width: 100%; overflow-x: auto; overflow-y: hidden; white-space: nowrap;
  }
  .display {
    font-size: 46px; font-weight: 600; color: #3a3552; font-family: 'Poppins',sans-serif;
    line-height: 1.15; max-width: 100%; overflow-x: auto; overflow-y: hidden; white-space: nowrap; text-align: right;
  }
  .subline::-webkit-scrollbar, .display::-webkit-scrollbar { display: none; }

  .keypad { margin: 18px 22px 22px; display: grid; grid-template-columns: repeat(7,1fr); gap: 11px; }

  button.calc-key {
    display: flex; align-items: center; justify-content: center;
    height: 54px; border-radius: 17px; border: none; outline: none; padding: 0;
    cursor: pointer; user-select: none; font-family: 'Poppins',sans-serif; font-size: 16px;
    transition: transform .09s ease, box-shadow .12s ease, filter .12s ease;
  }
  button.calc-key:hover { transform: translateY(-2px); filter: brightness(1.02); }
  button.calc-key:active { transform: translateY(1px) scale(.98); filter: brightness(.96); }

  .k-mode { grid-column: span 2; gap: 10px; background: #f3edff; box-shadow: 0 3px 8px rgba(150,120,200,.15); }
  .k-mode span { font-weight: 500; }
  .k-mode span.dim { color: #bdb6d0; }
  .k-mode span.active { color: #5a5475; }
  .k-mode .sep { color: #c9c1de; font-weight: 400; }

  .k-inv { background: #f3edff; color: #6a6288; box-shadow: 0 3px 8px rgba(150,120,200,.15); }
  .k-inv.active { background: linear-gradient(135deg,#ff9dc4,#8ec8ff); color: #fff; }

  .k-ce { background: #ffffff; color: #c86aa0; box-shadow: 0 3px 9px rgba(230,150,180,.22); font-size: 16px; font-weight: 600; }

  .k-paren { background: #ffeef5; color: #d06a92; box-shadow: 0 3px 8px rgba(220,140,170,.16); font-size: 18px; }

  .k-op { background: #ffe4ef; color: #d0517f; box-shadow: 0 3px 8px rgba(220,120,160,.2); font-size: 20px; }
  .k-op-lg { font-size: 22px; }

  .k-fn { background: #eef5ff; color: #5b7fa6; box-shadow: 0 3px 8px rgba(120,150,200,.15); font-size: 15px; }

  .k-num { background: #ffffff; color: #3a3552; box-shadow: 0 3px 9px rgba(150,140,180,.14); font-size: 19px; font-weight: 500; }

  .k-back { background: #ffffff; color: #8a83a0; box-shadow: 0 3px 9px rgba(150,140,180,.14); font-size: 20px; }

  .k-eq { background: linear-gradient(135deg,#ff9dc4,#8ec8ff); color: #ffffff; box-shadow: 0 6px 18px rgba(255,140,185,.5); font-size: 23px; font-weight: 600; }

  .footnote { padding: 0 28px 24px; color: #a79fbf; font-size: 12.5px; line-height: 1.5; text-align: center; }

  sup { font-size: 11px; }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="dot"></div>
        <div class="app-title">계산기</div>
      </div>
      <div class="menu-dots">&#8942;</div>
    </div>

    <div class="display-area">
      <div class="subline" id="subline"></div>
      <div class="display" id="display">0</div>
    </div>

    <div class="keypad" id="keypad">
      <button class="calc-key k-mode" data-k="mode" type="button">
        <span class="rad-label">Rad</span><span class="sep">&middot;</span><span class="deg-label">Deg</span>
      </button>
      <button class="calc-key k-inv" data-k="inv" type="button">Inv</button>
      <button class="calc-key k-ce" data-k="CE" type="button">CE</button>
      <button class="calc-key k-paren" data-k="(" type="button">(</button>
      <button class="calc-key k-paren" data-k=")" type="button">)</button>
      <button class="calc-key k-op" data-k="*" type="button">&times;</button>

      <button class="calc-key k-fn" id="sin-btn" data-k="sin" type="button">sin</button>
      <button class="calc-key k-fn" id="cos-btn" data-k="cos" type="button">cos</button>
      <button class="calc-key k-fn" id="tan-btn" data-k="tan" type="button">tan</button>
      <button class="calc-key k-num" data-k="7" type="button">7</button>
      <button class="calc-key k-num" data-k="8" type="button">8</button>
      <button class="calc-key k-num" data-k="9" type="button">9</button>
      <button class="calc-key k-op" data-k="/" type="button">&divide;</button>

      <button class="calc-key k-fn" data-k="!" type="button">x!</button>
      <button class="calc-key k-fn" data-k="ln" type="button">ln</button>
      <button class="calc-key k-fn" data-k="pi" type="button" style="font-size:18px;">&pi;</button>
      <button class="calc-key k-num" data-k="4" type="button">4</button>
      <button class="calc-key k-num" data-k="5" type="button">5</button>
      <button class="calc-key k-num" data-k="6" type="button">6</button>
      <button class="calc-key k-op k-op-lg" data-k="-" type="button">&minus;</button>

      <button class="calc-key k-fn" data-k="log" type="button">log</button>
      <button class="calc-key k-fn" data-k="e" type="button" style="font-size:18px;">e</button>
      <button class="calc-key k-fn" data-k="sqrt" type="button" style="font-size:18px;">&radic;</button>
      <button class="calc-key k-num" data-k="1" type="button">1</button>
      <button class="calc-key k-num" data-k="2" type="button">2</button>
      <button class="calc-key k-num" data-k="3" type="button">3</button>
      <button class="calc-key k-op k-op-lg" data-k="+" type="button">+</button>

      <button class="calc-key k-fn" data-k="Ans" type="button">Ans</button>
      <button class="calc-key k-fn" data-k="EXP" type="button">EXP</button>
      <button class="calc-key k-fn" data-k="^" type="button">x<sup>y</sup></button>
      <button class="calc-key k-num" data-k="." type="button">.</button>
      <button class="calc-key k-num" data-k="0" type="button">0</button>
      <button class="calc-key k-back" data-k="back" type="button">&#9003;</button>
      <button class="calc-key k-eq" data-k="=" type="button">=</button>
    </div>

    <div class="footnote">13번째 유효숫자에서 반올림하며, 15자리 이상의 계산은 오차가 있을 수 있습니다.</div>
  </div>

<script>
(function () {
  const displayEl = document.getElementById('display');
  const sublineEl = document.getElementById('subline');
  const keypad = document.getElementById('keypad');
  const radLabel = document.querySelector('.rad-label');
  const degLabel = document.querySelector('.deg-label');
  const invBtn = document.querySelector('.k-inv');
  const sinBtn = document.getElementById('sin-btn');
  const cosBtn = document.getElementById('cos-btn');
  const tanBtn = document.getElementById('tan-btn');

  let state = { disp: '0', sub: '', ans: 0, mode: 'Deg', inv: false, justEval: false, err: false };

  function render() {
    displayEl.textContent = state.disp;
    sublineEl.textContent = state.sub;
    radLabel.className = 'rad-label ' + (state.mode === 'Rad' ? 'active' : 'dim');
    degLabel.className = 'deg-label ' + (state.mode === 'Deg' ? 'active' : 'dim');
    invBtn.classList.toggle('active', state.inv);
    sinBtn.textContent = state.inv ? 'sin⁻¹' : 'sin';
    cosBtn.textContent = state.inv ? 'cos⁻¹' : 'cos';
    tanBtn.textContent = state.inv ? 'tan⁻¹' : 'tan';
    displayEl.scrollLeft = displayEl.scrollWidth;
    sublineEl.scrollLeft = sublineEl.scrollWidth;
  }

  function fact(n) {
    if (n < 0 || Math.floor(n) !== n) return NaN;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function tokenize(s, ans) {
    const T = [];
    let i = 0;
    const isD = (c) => c >= '0' && c <= '9';
    while (i < s.length) {
      const c = s[i];
      if (c === ' ') { i++; continue; }
      if (isD(c) || c === '.') {
        let j = i, num = '';
        while (j < s.length && (isD(s[j]) || s[j] === '.')) num += s[j++];
        if (s[j] === 'E') {
          num += 'e'; j++;
          if (s[j] === '+' || s[j] === '-') num += s[j++];
          while (j < s.length && isD(s[j])) num += s[j++];
        }
        T.push({ t: 'num', v: parseFloat(num) });
        i = j;
        continue;
      }
      if (c === '√') { T.push({ t: 'func', v: 'sqrt' }); i++; continue; }
      if (c === 'π') { T.push({ t: 'const', v: Math.PI }); i++; continue; }
      if (/[a-zA-Z]/.test(c)) {
        let j = i, name = '';
        while (j < s.length && /[a-zA-Z]/.test(s[j])) name += s[j++];
        const fns = ['asin', 'acos', 'atan', 'sin', 'cos', 'tan', 'ln', 'log', 'sqrt'];
        if (fns.indexOf(name) !== -1) T.push({ t: 'func', v: name });
        else if (name === 'e') T.push({ t: 'const', v: Math.E });
        else if (name === 'pi') T.push({ t: 'const', v: Math.PI });
        else if (name === 'Ans' || name === 'ans') T.push({ t: 'const', v: ans });
        else throw new Error('name ' + name);
        i = j;
        continue;
      }
      if (c === '×') { T.push({ t: 'op', v: '*' }); i++; continue; }
      if (c === '÷') { T.push({ t: 'op', v: '/' }); i++; continue; }
      if (c === '−' || c === '-') { T.push({ t: 'op', v: '-' }); i++; continue; }
      if (c === '+' || c === '*' || c === '/' || c === '^') { T.push({ t: 'op', v: c }); i++; continue; }
      if (c === '(') { T.push({ t: 'lp' }); i++; continue; }
      if (c === ')') { T.push({ t: 'rp' }); i++; continue; }
      if (c === '!') { T.push({ t: 'fact' }); i++; continue; }
      throw new Error('char ' + c);
    }
    return T;
  }

  function evaluate(raw, mode, ans) {
    let s = raw;
    const open = (s.match(/\(/g) || []).length;
    const close = (s.match(/\)/g) || []).length;
    if (open > close) s += ')'.repeat(open - close);
    const T = tokenize(s, ans);
    let p = 0;
    const peek = () => T[p];
    const eat = () => T[p++];
    const d2r = (x) => mode === 'Deg' ? x * Math.PI / 180 : x;
    const r2d = (x) => mode === 'Deg' ? x * 180 / Math.PI : x;
    const applyFn = (name, a) => {
      switch (name) {
        case 'sin': return Math.sin(d2r(a));
        case 'cos': return Math.cos(d2r(a));
        case 'tan': return Math.tan(d2r(a));
        case 'asin': return r2d(Math.asin(a));
        case 'acos': return r2d(Math.acos(a));
        case 'atan': return r2d(Math.atan(a));
        case 'ln': return Math.log(a);
        case 'log': return Math.log10(a);
        case 'sqrt': return Math.sqrt(a);
      }
      throw new Error('fn');
    };
    const parseExpr = () => {
      let v = parseTerm();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
        const op = eat().v; const r = parseTerm(); v = op === '+' ? v + r : v - r;
      }
      return v;
    };
    const parseTerm = () => {
      let v = parsePower();
      while (peek() && peek().t === 'op' && (peek().v === '*' || peek().v === '/')) {
        const op = eat().v; const r = parsePower(); v = op === '*' ? v * r : v / r;
      }
      return v;
    };
    const parsePower = () => {
      const b = parseUnary();
      if (peek() && peek().t === 'op' && peek().v === '^') { eat(); const e = parsePower(); return Math.pow(b, e); }
      return b;
    };
    const parseUnary = () => {
      if (peek() && peek().t === 'op' && (peek().v === '-' || peek().v === '+')) {
        const op = eat().v; const v = parseUnary(); return op === '-' ? -v : v;
      }
      return parsePostfix();
    };
    const parsePostfix = () => {
      let v = parsePrimary();
      while (peek() && peek().t === 'fact') { eat(); v = fact(v); }
      return v;
    };
    const parsePrimary = () => {
      const tk = peek();
      if (!tk) throw new Error('end');
      if (tk.t === 'num') { eat(); return tk.v; }
      if (tk.t === 'const') { eat(); return tk.v; }
      if (tk.t === 'lp') { eat(); const v = parseExpr(); if (peek() && peek().t === 'rp') eat(); return v; }
      if (tk.t === 'func') {
        eat();
        let arg;
        if (peek() && peek().t === 'lp') { eat(); arg = parseExpr(); if (peek() && peek().t === 'rp') eat(); }
        else arg = parseUnary();
        return applyFn(tk.v, arg);
      }
      throw new Error('primary');
    };
    const v = parseExpr();
    if (p < T.length) throw new Error('trailing');
    return v;
  }

  function fmt(x) {
    if (Number.isNaN(x)) return '오류';
    if (!isFinite(x)) return x > 0 ? '∞' : '-∞';
    const r = parseFloat(x.toPrecision(13));
    return String(r);
  }

  function reduce(s, k) {
    if (k === 'mode') return Object.assign({}, s, { mode: s.mode === 'Deg' ? 'Rad' : 'Deg' });
    if (k === 'inv') return Object.assign({}, s, { inv: !s.inv });
    if (k === 'CE') return Object.assign({}, s, { disp: '0', sub: '', justEval: false, err: false });
    if (k === 'back') {
      if (s.err) return Object.assign({}, s, { disp: '0', sub: '', err: false, justEval: false });
      let d = s.disp;
      d = d.length <= 1 ? '0' : d.slice(0, -1);
      if (d === '' || d === '-' || d === '−') d = '0';
      return Object.assign({}, s, { disp: d, justEval: false });
    }
    if (k === '=') {
      try {
        const val = evaluate(s.disp, s.mode, s.ans);
        const out = fmt(val);
        if (out === '오류') return Object.assign({}, s, { disp: '오류', err: true, justEval: true });
        return Object.assign({}, s, { disp: out, sub: s.disp, ans: val, justEval: true, err: false });
      } catch (e) {
        return Object.assign({}, s, { disp: '오류', sub: s.disp, err: true, justEval: true });
      }
    }

    const map = {
      '*': '×', '/': '÷', '-': '−', '+': '+', '^': '^',
      '(': '(', ')': ')', '.': '.',
      'sin': s.inv ? 'asin(' : 'sin(',
      'cos': s.inv ? 'acos(' : 'cos(',
      'tan': s.inv ? 'atan(' : 'tan(',
      'ln': 'ln(', 'log': 'log(', 'sqrt': '√(',
      'pi': 'π', 'e': 'e', 'Ans': 'Ans', 'EXP': 'E', '!': '!'
    };
    let text = (k >= '0' && k <= '9') ? k : map[k];
    if (text === undefined) return s;

    const isDigit = (k >= '0' && k <= '9') || k === '.';
    const isValue = isDigit || ['pi', 'e', 'Ans'].indexOf(k) !== -1 || /\($/.test(text) || ['sin', 'cos', 'tan', 'ln', 'log', 'sqrt'].indexOf(k) !== -1;
    const operators = ['+', '-', '*', '/', '^', ')', '!', 'EXP'];

    let d = s.disp;
    if (s.err) d = '0';

    if (s.justEval || s.err) {
      if (operators.indexOf(k) !== -1) {
        d = (d === '오류' ? String(s.ans) : d) + text;
      } else {
        d = text === '.' ? '0.' : text;
      }
      return Object.assign({}, s, { disp: d, sub: '', justEval: false, err: false });
    }

    if (d === '0') {
      if (text === '.') return Object.assign({}, s, { disp: '0.', justEval: false });
      if (isValue) return Object.assign({}, s, { disp: text, justEval: false });
      return Object.assign({}, s, { disp: d + text, justEval: false });
    }
    return Object.assign({}, s, { disp: d + text, justEval: false });
  }

  function press(k) {
    state = reduce(state, k);
    render();
  }

  keypad.addEventListener('click', (e) => {
    const el = e.target.closest('[data-k]');
    if (!el) return;
    press(el.getAttribute('data-k'));
  });

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k >= '0' && k <= '9') press(k);
    else if (k === '.') press('.');
    else if (k === '+') press('+');
    else if (k === '-') press('-');
    else if (k === '*') press('*');
    else if (k === '/') { e.preventDefault(); press('/'); }
    else if (k === '(') press('(');
    else if (k === ')') press(')');
    else if (k === '^') press('^');
    else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
    else if (k === 'Backspace') press('back');
    else if (k === 'Escape') press('CE');
  });

  render();
})();
</script>
</body>
</html>
